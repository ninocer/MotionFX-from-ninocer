name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install pinned Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Validate Gradle wrapper and configure cache
        uses: gradle/actions/setup-gradle@v4
      - name: Check reproducible example packages
        run: |
          python3 tools/package_plugin.py examples/starter examples/starter.mfxplugin --check
          python3 tools/package_plugin.py examples/starter app/src/main/assets/starter.mfxplugin --check
      - name: Run Plugin API tests and Android lint; build APK and device tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :plugin-api:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionFX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload sample plugin
        uses: actions/upload-artifact@v4
        with:
          name: MotionFX-starter-plugin
          path: examples/starter.mfxplugin
          if-no-files-found: error
      - name: Upload reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MotionFX-check-reports
          path: |
            plugin-api/build/reports/tests/
            plugin-api/build/test-results/
            app/build/reports/
          if-no-files-found: warn

  device-tests:
    name: GLES and MP4 integration tests (Android 35)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon --stacktrace --console=plain :app:connectedDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MotionFX-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
